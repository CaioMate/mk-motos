# n8n (automações) do MK Motos.
# Sobe com:  docker compose -f /opt/mk-motos/deploy/n8n/docker-compose.yml up -d
# N8N_DOMINIO e N8N_DADOS vêm do arquivo .env que o instalar.sh cria nesta mesma pasta.
# Versão fixa da imagem: para atualizar, troque o número abaixo por uma versão mais nova
# (veja em https://docs.n8n.io/release-notes/) e rode o comando de novo.
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.5
    container_name: mk-motos-n8n
    restart: unless-stopped
    ports:
      # Só a própria VPS acessa esta porta; o Caddy é que publica o site com HTTPS.
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_DOMINIO}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_DOMINIO}/
      - N8N_SECURE_COOKIE=true
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
    volumes:
      # Dados persistentes (banco do n8n, chave de criptografia). Fica fora da pasta do programa.
      - ${N8N_DADOS:-/opt/mk-motos-n8n}:/home/node/.n8n
