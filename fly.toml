# Configuração da hospedagem no Fly.io (servidor em São Paulo).
app = 'mk-motos'
primary_region = 'gru'

[build]

[env]
  PORT = '8080'
  MKMOTOS_DB = '/data/mkmotos.db'

# Disco permanente: banco de dados, comprovantes e fotos das motos
[mounts]
  source = 'mkmotos_dados'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Fica sempre ligado: o GPS das motos manda posições o tempo todo
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
